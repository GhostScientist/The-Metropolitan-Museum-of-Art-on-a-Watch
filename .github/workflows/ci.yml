name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch-app:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test core logic without network or signing
        run: swift test
      - name: Build watch app for simulator
        run: |
          xcodebuild \
            -project "The Tiny Met.xcodeproj" \
            -scheme "The Tiny Met Watch App" \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TinyMetDerivedData" \
            CODE_SIGNING_ALLOWED=NO build
